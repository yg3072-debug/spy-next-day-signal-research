# P1 — the single confirmatory procedure.
#
# Everything the procedure needs is fixed here before it runs once. The SHA-256 of
# this file is recorded in the protocol and in every run manifest, so a reader can
# tell whether a published result came from the frozen configuration or from a
# later edit. Changing any value below produces a new protocol version; it does not
# amend this one.

meta:
  id: P1
  role: confirmatory_primary_procedure
  execution_specification: primary_open_to_close
  frozen: 2026-08-23

# ---------------------------------------------------------------- sample & target

sample:
  snapshot: data/market_inputs_2026-08-21.csv
  snapshot_sha256: 9b337ca75f8d077963448853e97542fab1258ab5b6dd289debec14061012b13a
  # The modelling set is every session with a complete feature row.
  initial_train_sessions: 1000

target:
  # Labels are built from log returns; P&L is compounded from simple returns.
  # The two live in different places and are never mixed inside one expression.
  label_return: log            # log(Close_{t+1} / Open_{t+1})
  pnl_return: simple           # Close_{t+1} / Open_{t+1} - 1
  volatility_scaler: Volatility_20
  volatility_epsilon: 1.0e-8
  quantiles: [0.25, 0.75]

# --------------------------------------------------------------------- validation

walk_forward:
  outer_step_sessions: 21              # monthly refit
  retune_every_outer_steps: 12         # annual reselection
  window: expanding                    # rolling-1000 is E13, not P1
  embargo_sessions: 1

  # What the annual reselection fixes, and what the monthly refit re-estimates.
  # Splitting these two is the difference between a procedure and a moving target.
  frozen_at_retune:
    - model_family
    - hyperparameters
    - delta_multiple
  reestimated_every_outer_step:
    - label_quantiles_q25_q75
    - selected_features
    - scaler
    - fitted_model
    - probability_calibrator
    - class_conditional_means

inner_cv:
  splitter: TimeSeriesSplit
  n_splits: 5
  gap: 1
  # Feature selection and quantile estimation depend only on the inner-train slice,
  # not on the candidate configuration, so they are computed once per inner fold and
  # shared across the grid. This is an efficiency, not a shortcut: every candidate
  # still sees only the labels and features its own inner-train produced.
  share_fold_preprocessing_across_grid: true

# ------------------------------------------------------------- feature selection
# Runs inside every inner-train slice and again on each outer-train refit. No step
# is manual; every threshold below is fixed here.

feature_selection:
  drop_zero_variance: true
  ic:
    method: spearman
    rolling_window_sessions: 60
    statistic: abs_mean            # |mean rolling IC| over the slice
  per_group_top_k: 3               # within each of the 13 hypothesis groups
  correlation_pruning:
    linkage: average
    metric: one_minus_abs_correlation
    cut_distance: 0.20             # merges anything correlated above 0.80
    keep: highest_abs_ic
  max_features: 25

# ------------------------------------------------------------------------ models
# Grid sizes are deliberately small. A wider grid does not increase the trial count
# (S-24) but it does increase the variance of the inner selection, which is the
# quantity the one-standard-error rule exists to control.

models:
  majority_baseline:
    complexity_rank: 0
    grid: [{}]

  logistic:
    complexity_rank: 1
    scaler: standard
    fixed: {max_iter: 1000, multi_class: multinomial}
    grid:
      C: [0.01, 0.1, 1.0]          # ascending C is ascending complexity
      class_weight: [null, balanced]

  random_forest:
    complexity_rank: 2
    fixed: {n_estimators: 300, max_features: 0.5, n_jobs: 1}
    grid:
      max_depth: [3, 5]            # ascending depth is ascending complexity
      min_samples_leaf: [50, 20]   # descending leaf size is ascending complexity

  lightgbm:
    complexity_rank: 3
    fixed: {n_estimators: 300, subsample: 0.7, colsample_bytree: 0.7, n_jobs: 1, verbose: -1}
    grid:
      num_leaves: [7, 15]
      learning_rate: [0.03, 0.1]
      min_child_samples: [60, 30]

  xgboost:
    complexity_rank: 4
    fixed: {n_estimators: 300, subsample: 0.7, colsample_bytree: 0.7, n_jobs: 1}
    grid:
      max_depth: [2, 3]
      learning_rate: [0.03, 0.1]

# 1 + 6 + 4 + 8 + 4 = 23 candidate configurations per retune.

# ------------------------------------------------------------------- calibration

calibration:
  method: isotonic
  # Cross-fitted: raw probabilities are produced on inner-validation folds, the
  # calibrator is fitted on the concatenated inner-OOS, and the base estimator is
  # refitted on the full outer-train. This is sklearn's CalibratedClassifierCV with
  # ensemble=False. The base estimator is better fitted after the refit than it was
  # on the folds the calibrator saw; that mismatch is inherent to cross-fitting and
  # is reported through the calibration diagnostics rather than assumed away.
  ensemble: false
  diagnostics_required:
    - inner_oos_brier_score
    - inner_oos_brier_skill_vs_train_base_rate
    - reliability_curve
    - brier_before_and_after_calibration

expected_return_mapping:
  # mu_hat = sum_c  P_calibrated(c | x) * E[R | c]
  # E[R | c] is the mean simple O2C return of outer-train observations labelled c,
  # using that refit's own quantiles. Outer-train only.
  class_conditional_mean_source: outer_train

# ---------------------------------------------------------------- trading rule

position_rule:
  # w = +1 if mu_hat > (1 + delta_multiple) * 2c ; -1 if below the negative of it.
  # delta is expressed as a multiple of the round-trip cost so it stays meaningful
  # when the cost scenario changes.
  threshold: cost_determined
  delta_multiple_grid: [0.0, 0.5, 1.0, 2.0]
  positions: [-1, 0, 1]

costs:
  base_bps_per_side: 2.0           # assumed all-in execution cost, not a quoted spread
  round_trip_multiplier: 2         # entry at the open and exit at the close
  scenarios_bps_per_side: [0.0, 1.0, 2.0, 5.0, 10.0]
  intraday_financing_charged: false   # base case; charged variant is E-group
  borrow_annual_bps: 25               # applies to the C2C specification only

# ------------------------------------------------------------------- selection
# The one-standard-error rule, stated precisely enough to be executed without
# judgement.

selection:
  primary_metric: inner_oos_net_sharpe
  metric_cost_bps_per_side: 2.0
  # Point estimate: computed once on the concatenated inner-OOS return series,
  # never as an average of per-fold Sharpe ratios.
  point_estimate: concatenated_inner_oos
  standard_error:
    method: stationary_bootstrap
    block_sessions: 20
    reps: 1000                     # 10,000 is used for reported intervals; 1,000
                                   # inside the selection loop affects no published
                                   # number, only the width of the tie band.
    seed_offset: 101
  rule: >
    Take the configuration with the highest primary metric. Among all configurations
    whose primary metric is within one standard error of that maximum, take the
    simplest, where simpler means the lower (complexity_rank, within_family_rank)
    in the declared ordering. Ties beyond that resolve to the earliest entry in the
    declared grid order.
  constraints:
    # Diagnostics that can veto a candidate, but never rank one.
    min_active_positions_inner_oos: 30
    require_finite_sharpe: true
  degenerate_handling: >
    A configuration with fewer than 30 active positions on the concatenated
    inner-OOS, or with undefined Sharpe because its excess return has zero
    variance, is excluded from ranking and recorded as degenerate. If every
    configuration is degenerate at a retune, the majority baseline is selected and
    the step is flagged as having produced no tradeable model.

# ------------------------------------------------------------------ determinism

seeds:
  base: 20260823
  per_outer_step: base_plus_step_index
  n_jobs_per_fit: 1                # parallelism is at the outer-step level

# -------------------------------------------------------------------- artefacts

outputs:
  - results/oos_predictions.csv        # date, probabilities, mu_hat, w, realised return
  - results/trade_ledger.csv
  - results/selection_log.csv          # every retune: candidate, metric, SE, chosen, why
  - results/feature_stability.csv
  - results/calibration_diagnostics.csv
  - results/run_manifest.json          # snapshot SHA, config SHA, code commit, versions
