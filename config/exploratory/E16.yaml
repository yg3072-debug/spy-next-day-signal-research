# E16 - isotonic calibration instead of Platt
#
# An overlay on config/p1.yaml, merged at run time. The frozen file is never
# edited: its SHA-256 is unchanged and this overlay carries its own, both recorded
# in the run manifest. This specification is exploratory. It produces no headline
# and cannot replace P1, whatever it shows.
#
# The protocol argues sigmoid is the right choice at this sample size and that
# isotonic would overfit its own calibration set. This attaches a number to
# that argument rather than leaving it as an assertion.

meta:
  id: E16
  role: exploratory

calibration:
  method: isotonic
