name: tests

on:
  push:
    branches: [main, v2-research]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history, so the guard below can inspect what a push actually adds
      # rather than only the tip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Two different claims, kept apart deliberately.
      #
      # The frozen configuration is committed, so CI recomputes its digest from the
      # bytes in the checkout and compares it against the digest committed beside
      # it. That is a real verification and it fails loudly.
      #
      # The market snapshot is licensed and is NOT distributed here, so its bytes
      # cannot be rehashed from a public clone. CI therefore only checks that every
      # file recording the snapshot's identifier records the same one, and the step
      # prints NOT VERIFIED so the weaker claim is never read as the stronger one.
      # A user who supplies their own legally obtained snapshot and manifest gets
      # byte verification automatically.
      #
      # Nothing in this job reaches the network.
      - name: Verify published freeze records
        run: python scripts/verify_hashes.py

      # Feature definitions are static metadata and are checkable without any vendor
      # data: the builders run against the synthetic fixture purely to populate the
      # registry. Coverage and session counts are measured from the frozen run and are
      # not recomputed here.
      - name: Verify feature definitions against the registry
        run: python scripts/build_docs.py --metadata-only

      - name: Verify the alternative-data checksums
        run: python scripts/freeze_alt_data.py --verify

      # Data governance and repository hygiene, kept as a separate step from the rest
      # of the suite so a failure here is unmistakable in the run summary. These are
      # the rules about what may enter a public research repository at all: no vendor
      # market data, no third-party document text or record identifiers, no
      # environment-specific paths, no credentials.
      - name: Repository data governance and coverage contracts
        run: |
          pytest tests/test_no_raw_corpus.py tests/test_repository_hygiene.py \
                 tests/test_coverage_contracts.py -q

      # Blocks a *new* commit from reintroducing a raw corpus path. It inspects only
      # what this push or pull request adds; the point is to keep the sanitized
      # history clean, not to re-scan history that was already dealt with.
      - name: Reject newly added raw-corpus paths
        run: |
          set -eu
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no comparable base; skipping incremental path check"
            exit 0
          fi
          ADDED=$(git diff --name-only --diff-filter=A "$BASE" HEAD || true)
          echo "files added by this change:"; echo "${ADDED:-  (none)}"
          BLOCKED=$(printf '%s\n' "$ADDED" | grep -Ei \
            'data/raw/|vendor/|local_data/|trump_archive|truth_social_sessions|news_headlines_sessions|empty_post_diagnosis\.csv|raw_posts|raw_headlines|transcript' \
            || true)
          if [ -n "$BLOCKED" ]; then
            echo "::error::a raw-corpus path was added:"; echo "$BLOCKED"; exit 1
          fi
          echo "no raw-corpus paths added"

      - name: Run the full test suite
        run: pytest tests/ -q
