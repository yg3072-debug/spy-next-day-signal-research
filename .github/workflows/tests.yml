name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The snapshot is committed, so nothing here touches the network. This step
      # fails loudly if the data, the configuration, or the hashes the protocol
      # quotes have drifted apart.
      - name: Verify the frozen configuration hash
        run: python scripts/verify_hashes.py

      - name: Run the test suite
        run: pytest tests/ -q
